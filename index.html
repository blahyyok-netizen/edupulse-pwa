<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6750a4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Пульс">
<title>Навчальний Пульс</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="stylesheet" href="/styles.css?v=__VERSION__">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><span class="pulse-dot"></span> Навчальний Пульс</div>
    <button id="themeBtn" class="icon-btn" aria-label="Тема">🌙</button>
  </div>
</header>

<main id="app" class="container">
  <section id="view-schedule" class="view">
    <div class="segmented">
      <button class="seg active" data-mode="student">Студент</button>
      <button class="seg" data-mode="teacher">Викладач</button>
    </div>
    <div class="row">
      <select id="whoSel" class="input"></select>
    </div>
    <div id="calBox" class="cal"></div>
    <div id="scheduleList" class="list"></div>
    <div id="tProgress" class="list"></div>
  </section>

  <section id="view-journal" class="view">
    <div id="journalHead" class="muted small"></div>
    <div id="journalList" class="list"></div>
  </section>

  <section id="view-news" class="view">
    <div id="newsList" class="list"></div>
  </section>

  <section id="view-more" class="view">
    <div class="section-title">Контакти</div>
    <div id="contactsList" class="list"></div>
    <div class="section-title">Оплата</div>
    <div id="payWho" class="card"></div>
    <div id="paymentsList" class="list"></div>
    <div class="card">
      <div class="section-title" style="margin-top:0">Інше</div>
      <a class="menu-link" href="https://tt.sclnau.com.ua/others/user_guide.html" target="_blank" rel="noopener">📖 Інструкція користувача</a>
      <a class="menu-link" href="https://sclnau.com.ua" target="_blank" rel="noopener">🌐 Сайт коледжу</a>
      <a class="menu-link" href="mailto:admin@sclnau.com.ua">✉️ Підтримка</a>
    </div>
  </section>
</main>

<nav class="tabbar">
  <a href="#/schedule" data-tab="schedule"><span>📅</span>Розклад</a>
  <a href="#/journal" data-tab="journal"><span>📚</span>Журнал</a>
  <a href="#/news" data-tab="news"><span>📰</span>Новини</a>
  <a href="#/more" data-tab="more"><span>☰</span>Ще</a>
</nav>

<script src="/app.js?v=__VERSION__" defer></script>
</body>
</html>
