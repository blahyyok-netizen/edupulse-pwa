name = "edupulse-pwa"
main = "worker.js"
compatibility_date = "2025-10-01"

rules = [
  { type = "Data", globs = ["**/*.png"], fallthrough = true },
  { type = "Text", globs = ["**/*.html", "**/*.css", "**/*.js", "**/*.webmanifest"], fallthrough = true }
]

[[kv_namespaces]]
binding = "PUSH_SUBS"
id = "b67009a3d60e4107bc0b2730ccd31cf7"

[[d1_databases]]
binding = "DB"
database_name = "edupulse"
database_id = "4619714a-2240-4cfb-856c-4a3ace131f6b"
migrations_dir = "migrations"

[triggers]
crons = ["23,53 * * * *"]
